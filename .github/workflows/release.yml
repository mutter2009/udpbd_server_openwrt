name: Build UDPBD for OneThingCloud

on:
  workflow_dispatch: # 仅保留手动触发

jobs:
  build-onecloud:
    name: Build OneThingCloud (S805 / Cortex-A5)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Cross Compiler & Packaging Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf tar gzip

      - name: Compile UDPBD Binary
        run: |
          mkdir -p bin_out
          
          # 提取 C/C++ 源码，并针对玩客云 Cortex-A5 架构应用硬件加速编译参数
          SRC_C=$(find . -maxdepth 3 -name "*.c")
          SRC_CPP=$(find . -maxdepth 3 -name "*.cpp" -o -name "*.cc")

          if [ -n "$SRC_CPP" ]; then
            arm-linux-gnueabihf-g++ -O2 -march=armv7-a -mfpu=vfpv4-d16 -mfloat-abi=hard \
              -D_LARGEFILE64_SOURCE -D_GNU_SOURCE $SRC_C $SRC_CPP -o bin_out/udpbd-server
          else
            arm-linux-gnueabihf-gcc -O2 -march=armv7-a -mfpu=vfpv4-d16 -mfloat-abi=hard \
              -D_LARGEFILE64_SOURCE -D_GNU_SOURCE $SRC_C -o bin_out/udpbd-server
          fi

      - name: Build Standard IPK Package
        run: |
          mkdir -p ipk_root/CONTROL
          mkdir -p ipk_root/usr/bin
          mkdir -p ipk_root/etc/init.d

          # 1. 复制二进制执行文件
          cp bin_out/udpbd-server ipk_root/usr/bin/
          chmod +x ipk_root/usr/bin/udpbd-server

          # 2. 生成启动脚本 (强制设定 START=40)
          INIT_FILE=$(find . -name "*.init" -o -name "udpbd-server.init" | head -n 1)
          if [ -f "$INIT_FILE" ]; then
            cp "$INIT_FILE" ipk_root/etc/init.d/udpbd-server
          else
            cat << 'EOF' > ipk_root/etc/init.d/udpbd-server
#!/bin/sh /etc/rc.common
START=40
STOP=10
USE_PROCD=1

start_service() {
    procd_open_instance
    procd_set_param command /usr/bin/udpbd-server /dev/sda1
    procd_set_param respawn
    procd_close_instance
}
EOF
          fi
          sed -i 's/START=80/START=40/g' ipk_root/etc/init.d/udpbd-server
          chmod +x ipk_root/etc/init.d/udpbd-server

          # 3. 写入 OpenWrt 包描述
          cat << 'EOF' > ipk_root/CONTROL/control
Package: udpbd-server
Version: 1.0-1
Architecture: arm_cortex-a5_vfpv4
Maintainer: OpenWrt
Description: UDPBD Server for PS2 OPL on OneThingCloud
EOF

          # 4. 打包为 .ipk 格式
          mkdir -p ipk_out
          cd ipk_root
          tar -czf ../control.tar.gz -C CONTROL .
          rm -rf CONTROL
          tar -czf ../data.tar.gz .
          cd ..
          echo "2.0" > debian-binary
          tar -czf ipk_out/udpbd-server_1.0-1_arm_cortex-a5_vfpv4.ipk debian-binary control.tar.gz data.tar.gz

      - name: Upload OneThingCloud IPK File
        uses: actions/upload-artifact@v4
        with:
          name: udpbd-server-arm_cortex-a5_vfpv4
          path: ipk_out/*.ipk
