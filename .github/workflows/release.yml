# Build UDPBD Server IPK and Binary (Standalone Toolchain)
name: Build UDPBD Server

on:
  workflow_dispatch: # 仅保留手动触发

jobs:
  build-onecloud:
    name: Build OneThingCloud (S805 / ARM32)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ARM Cross-Compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf

      - name: Modify START=40 and CXXFLAGS
        run: |
          # 强制将 init 启动文件中的 START=80 修改为 START=40
          INIT_FILES=$(find . -type f \( -name "*.init" -o -name "udpbd-server" \))
          for f in $INIT_FILES; do
            sed -i 's/START=80/START=40/g' "$f" || true
          done

      - name: Compile Binary for OneThingCloud
        run: |
          mkdir -p build_out
          # 使用 32位 ARM 交叉编译器直接编译二进制文件
          if [ -f "src/Makefile" ] || [ -f "Makefile" ]; then
            make CC=arm-linux-gnueabihf-gcc CXX=arm-linux-gnueabihf-g++ \
                 CFLAGS="-O2 -D_LARGEFILE64_SOURCE -D_GNU_SOURCE" \
                 CXXFLAGS="-O2 -D_LARGEFILE64_SOURCE -D_GNU_SOURCE" || true
          fi
          
          # 寻找编译出的二进制文件并备份
          find . -maxdepth 3 -type f -executable -name "udpbd-server*" -exec cp {} build_out/ \;

      - name: Upload OneThingCloud Binary
        uses: actions/upload-artifact@v4
        with:
          name: udpbd-server-onethingcloud-s805
          path: build_out/
