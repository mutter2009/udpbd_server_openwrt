name: Build OneThingCloud UDPBD IPK

on:
  workflow_dispatch:

jobs:
  build-onecloud:
    name: Build OneThingCloud (S805 / Cortex-A5)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Cross Compiler & Packaging Tools
        run: |
          sudo apt update
          sudo apt install -y gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf tar gzip
      - name: Compile UDPBD Binary
        run: |
          mkdir -p bin_out
          
          SRC_C=$(find . -maxdepth 3 -name "*.c" 2>/dev/null || true)
          SRC_CPP=$(find . -maxdepth 3 -name "*.cpp" -o -name "*.cc" 2>/dev/null || true)
          if [ -n "$SRC_CPP" ]; then
            arm-linux-gnueabihf-g++ -O2 -march=armv7-a -mfpu=vfpv4-d16 -mfloat-abi=hard \
              -D_LARGEFILE64_SOURCE -D_GNU_SOURCE $SRC_C $SRC_CPP -o bin_out/udpbd-server
          elif [ -n "$SRC_C" ]; then
            arm-linux-gnueabihf-gcc -O2 -march=armv7-a -mfpu=vfpv4-d16 -mfloat-abi=hard \
              -D_LARGEFILE64_SOURCE -D_GNU_SOURCE $SRC_C -o bin_out/udpbd-server
          else
            echo "Error: No C/C++ source files found!"
            exit 1
          fi
      - name: Build Standard IPK Package
        run: |
          mkdir -p ipk_root/CONTROL
          mkdir -p ipk_root/usr/bin
          mkdir -p ipk_root/etc/init.d
          # 1. 复制二进制文件
          cp bin_out/udpbd-server ipk_root/usr/bin/
          chmod +x ipk_root/usr/bin/udpbd-server
          # 2. 生成启动脚本 (START=40)
          INIT_FILE=$(find . -name "*.init" -o -name "udpbd-server.init" 2>/dev/null | head -n 1)
          if [ -n "$INIT_FILE" ] && [ -f "$INIT_FILE" ]; then
            cp "$INIT_FILE" ipk_root/etc/init.d/udpbd-server
          else
            cat << 'EOF' > ipk_root/etc/init.d/udpbd-server
#!/bin/sh /etc/rc.common
START=40
 Check failure on line 55 in .github/workflows/release.yml


