# Build and Release OpenWrt & Linux UDPBD IPK (Multi-Arch)
name: Build and Release OpenWrt UDPBD IPK

on:
  workflow_dispatch:
    inputs:
      debug_enabled:
        description: 'Run with debug logging'
        required: false
        default: 'false'
  push:
    tags:
      - "v*.*.*"

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    strategy:
      matrix:
        target:
          # 1. 玩客云 32 位系统 (Cortex-A5 - 注入防 Illegal Instruction 参数)
          - {
              version: "19.07.10",
              arch: "armvirt",
              subarch: "32",
              pkg_arch: "arm_cortex-a5_vfpv4",
              extra_cflags: "-mcpu=cortex-a5 -mfpu=vfpv4-d16 -mfloat-abi=hard -marm",
            }
          # 2. 玩客云 / 电视盒子 64 位系统 (ARM64 / AArch64)
          - {
              version: "22.03.5",
              arch: "armvirt",
              subarch: "64",
              pkg_arch: "aarch64_generic",
              extra_cflags: "",
            }
          # 3. x86_64 软路由 / 工控机 / 虚拟机 (64-bit Intel/AMD)
          - {
              version: "22.03.5",
              arch: "x86",
              subarch: "64",
              pkg_arch: "x86_64",
              extra_cflags: "",
            }

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 2.x
        run: |
          sudo apt-get update
          sudo apt-get install -y python2 || true
          if [ -f /usr/bin/python2 ]; then
            sudo ln -sf /usr/bin/python2 /usr/bin/python
          fi

      - name: Download and setup OpenWrt SDK
        run: |
          cd ..
          SDK_VERSION=${{ matrix.target.version }}
          SDK_ARCH=${{ matrix.target.arch }}
          SDK_SUBARCH=${{ matrix.target.subarch }}
          BASE_URL="https://downloads.openwrt.org/releases/${SDK_VERSION}/targets/${SDK_ARCH}/${SDK_SUBARCH}/"

          echo "Fetching SDK list from ${BASE_URL}..."
          SDK_FILE=$(curl -sL ${BASE_URL} | grep -oE 'openwrt-sdk-[^"]+\.tar\.(xz|bz2)' | head -n 1)

          if [ -z "$SDK_FILE" ]; then
            echo "Error: Could not find SDK package at ${BASE_URL}"
            exit 1
          fi

          SDK_URL="${BASE_URL}${SDK_FILE}"
          echo "Downloading SDK from ${SDK_URL}"
          
          wget -q ${SDK_URL} -O openwrt-sdk.tar.xz || wget -q ${SDK_URL} -O openwrt-sdk.tar.bz2
          tar -xf openwrt-sdk.tar.*
          mv openwrt-sdk-* openwrt-sdk
          echo "WORK_DIR=$(pwd)/openwrt-sdk" >> $GITHUB_ENV

      - name: Install package sources into SDK
        run: |
          PKG_DIR="${{ env.WORK_DIR }}/package/udpbd-server"
          mkdir -p "$PKG_DIR"
          
          cp -r $GITHUB_WORKSPACE/* "$PKG_DIR/"
          
          # 这里改为提取 .cpp 文件
          find "$PKG_DIR" -mindepth 2 -name "*.cpp" -exec cp {} "$PKG_DIR/" \;
          find "$PKG_DIR" -mindepth 2 -name "*.h" -exec cp {} "$PKG_DIR/" \;
          
          echo "=== 检查复制后的源码文件列表 ==="
          ls -la "$PKG_DIR"

      - name: Compile the package
        id: compile
        run: |
          cd ${{ env.WORK_DIR }}

          echo "CONFIG_PACKAGE_udpbd-server=y" > .config
          make defconfig

          make package/udpbd-server/compile EXTRA_CFLAGS="${{ matrix.target.extra_cflags }}" V=s

          mkdir -p release_files

          IPK_PATH=$(find bin/packages -type f -name "*.ipk" | head -n 1)
          BIN_PATH=$(find build_dir -type f -name "udpbd-server" | head -n 1)

          if [ -n "$IPK_PATH" ]; then
            cp ${IPK_PATH} release_files/udpbd-server_${{ matrix.target.pkg_arch }}.ipk
          fi

          if [ -f "$BIN_PATH" ]; then
            cp ${BIN_PATH} release_files/udpbd-server_${{ matrix.target.pkg_arch }}
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: udpbd-server-${{ matrix.target.pkg_arch }}
          path: ${{ env.WORK_DIR }}/release_files/*

      - name: Create GitHub Release and Upload Asset
        if: "startsWith(github.ref, 'refs/tags/')"
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: ${{ env.WORK_DIR }}/release_files/*
          tag_name: ${{ github.ref_name }}
          name: UDPBD Server ${{ github.ref_name }}
          draft: false
          prerelease: false
