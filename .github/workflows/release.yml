# Build and Release OpenWrt & Linux UDPBD IPK (Multi-Arch)
name: Build and Release OpenWrt UDPBD IPK

on:
  workflow_dispatch:
    inputs:
      debug_enabled:
        description: 'Run with debug logging'
        required: false
        default: 'false'
  push:
    tags:
      - "v*.*.*"

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    strategy:
      matrix:
        target:
          # 1. 品胜经典大端路由器 (MIPS Big-Endian)
          - {
              version: "19.07.10",
              arch: "ar71xx",
              subarch: "generic",
              pkg_arch: "mips_24kc",
            }
          # 2. 玩客云专有 32 位系统 (Cortex-A5 - 采用 ARM32 SDK 编译并重定向架构名)
          - {
              version: "19.07.10",
              arch: "armvirt",
              subarch: "32",
              pkg_arch: "arm_cortex-a5_vfpv4",
            }
          # 3. 通用 32 位 ARM (ARMv7 - Cortex-A15)
          - {
              version: "19.07.10",
              arch: "armvirt",
              subarch: "32",
              pkg_arch: "arm_cortex-a15_neon-vfpv4",
            }
          # 4. 玩客云 / 电视盒子 64 位系统 (ARM64 / AArch64)
          - {
              version: "22.03.5",
              arch: "armvirt",
              subarch: "64",
              pkg_arch: "aarch64_generic",
            }
          # 5. x86_64 软路由 / 工控机 / 虚拟机 (64-bit Intel/AMD)
          - {
              version: "22.03.5",
              arch: "x86",
              subarch: "64",
              pkg_arch: "x86_64",
            }

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 2.x
        run: |
          sudo apt-get update
          sudo apt-get install -y python2 || true
          if [ -f /usr/bin/python2 ]; then
            sudo ln -sf /usr/bin/python2 /usr/bin/python
          fi

      - name: Download and setup OpenWrt SDK
        run: |
          cd ..
          SDK_VERSION=${{ matrix.target.version }}
          SDK_ARCH=${{ matrix.target.arch }}
          SDK_SUBARCH=${{ matrix.target.subarch }}
          BASE_URL="https://downloads.openwrt.org/releases/${SDK_VERSION}/targets/${SDK_ARCH}/${SDK_SUBARCH}/"

          echo "Fetching SDK list from ${BASE_URL}..."
          SDK_FILE=$(curl -sL ${BASE_URL} | grep -oE 'openwrt-sdk-[^"]+\.tar\.(xz|bz2)' | head -n 1)

          if [ -z "$SDK_FILE" ]; then
            echo "Error: Could not find SDK package at ${BASE_URL}"
            exit 1
          fi

          SDK_URL="${BASE_URL}${SDK_FILE}"
          echo "Downloading SDK from ${SDK_URL}"
          
          wget -q ${SDK_URL} -O openwrt-sdk.tar.xz || wget -q ${SDK_URL} -O openwrt-sdk.tar.bz2
          tar -xf openwrt-sdk.tar.*
          mv openwrt-sdk-* openwrt-sdk
          echo "WORK_DIR=$(pwd)/openwrt-sdk" >> $GITHUB_ENV

      - name: Install package sources into SDK
        run: |
          mkdir -p ${{ env.WORK_DIR }}/package/udpbd-server
          cp -r $GITHUB_WORKSPACE/* ${{ env.WORK_DIR }}/package/udpbd-server/

      - name: Compile the package
        id: compile
        run: |
          cd ${{ env.WORK_DIR }}
          make defconfig
          make package/udpbd-server/compile V=s

          IPK_PATH=$(find bin/packages -type f -name "udpbd-server_*.ipk" | head -n 1)
          BIN_PATH=$(find build_dir -type f -name "udpbd-server" | head -n 1)

          mkdir -p release_files
          
          # 解包 IPK 并修改 control 文件中的 Architecture 字段为目标架构名
          ORIGINAL_IPK="${IPK_PATH}"
          TARGET_ARCH="${{ matrix.target.pkg_arch }}"
          
          mkdir -p /tmp/ipk_unpack
          tar -C /tmp/ipk_unpack -xzf ${ORIGINAL_IPK}
          mkdir -p /tmp/ipk_unpack/control_dir
          tar -C /tmp/ipk_unpack/control_dir -xzf /tmp/ipk_unpack/control.tar.gz
          
          # 替换架构标签
          sed -i "s/^Architecture:.*/Architecture: ${TARGET_ARCH}/" /tmp/ipk_unpack/control_dir/control
          
          # 重新打包 control.tar.gz
          (cd /tmp/ipk_unpack/control_dir && tar -czf ../control.tar.gz .)
          rm -rf /tmp/ipk_unpack/control_dir
          
          # 重新生成 IPK 包
          NEW_IPK_NAME="udpbd-server_1.0-1_${TARGET_ARCH}.ipk"
          (cd /tmp/ipk_unpack && tar -czf release_files/${NEW_IPK_NAME} control.tar.gz data.tar.gz debian-binary)
          mv /tmp/ipk_unpack/release_files/${NEW_IPK_NAME} release_files/
          
          if [ -f "$BIN_PATH" ]; then
            cp ${BIN_PATH} release_files/udpbd-server_${TARGET_ARCH}
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: udpbd-server-${{ matrix.target.pkg_arch }}
          path: ${{ env.WORK_DIR }}/release_files/*

      - name: Create GitHub Release and Upload Asset
        if: "startsWith(github.ref, 'refs/tags/')"
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: ${{ env.WORK_DIR }}/release_files/*
          tag_name: ${{ github.ref_name }}
          name: UDPBD Server ${{ github.ref_name }}
          draft: false
          prerelease: false
